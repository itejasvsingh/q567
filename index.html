<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IIT Madras MBA — Elective Planner by Tejasv Singh</title>

<!-- PWA: lets this be added to the home screen and open like a real app -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" id="meta-theme-color" content="#ffffff">
<script>
  (function() {
    var storedTheme = localStorage.getItem('mbaplanner_theme');
    var isDark = storedTheme === 'dark' || (!storedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches);
    if (isDark) {
      document.documentElement.setAttribute('data-theme', 'dark');
      document.getElementById('meta-theme-color').setAttribute('content', '#000000');
    }
  })();
  function toggleTheme() {
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    if (isDark) {
      document.documentElement.removeAttribute('data-theme');
      document.getElementById('meta-theme-color').setAttribute('content', '#ffffff');
      localStorage.setItem('mbaplanner_theme', 'light');
    } else {
      document.documentElement.setAttribute('data-theme', 'dark');
      document.getElementById('meta-theme-color').setAttribute('content', '#000000');
      localStorage.setItem('mbaplanner_theme', 'dark');
    }
  }
</script>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MBA Planner">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<button id="theme-toggle" onclick="toggleTheme()" style="position:fixed; bottom:20px; right:20px; z-index:9999; background:var(--bg2); border:.5px solid var(--bd); border-radius:50%; width:50px; height:50px; font-size:20px; cursor:pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); display:flex; align-items:center; justify-content:center;-webkit-tap-highlight-color:transparent;">🌗</button>
<div class="page">

<div class="hdr" style="display:flex; justify-content:space-between; align-items:center;">
  <div>
    <h1>IIT Madras MBA — Elective Planner</h1>
    <p>Q5: Jul–Sep 2026 · Q6: Oct–Dec 2026 · Q7: Jan–Mar 2027 · 12 electives total</p>
  </div>

</div>

<div class="view-tabs">
  <button class="view-tab on" id="vtab-plan" onclick="switchView('plan')">📋 My Planner</button>
  <button class="view-tab" id="vtab-daily" onclick="switchView('daily')">📅 Daily Agenda</button>
  <button class="view-tab" id="vtab-master" onclick="switchView('master')">🗓️ Weekly Schedule</button>
  <button class="view-tab" id="vtab-att" onclick="switchView('att')">✅ Attendance</button>
  <button class="view-tab" id="vtab-compare" onclick="switchView('compare')">👥 Compare with Friends</button>
  <button class="view-tab" id="vtab-mess" onclick="switchView('mess')">🍽 Mess Menu</button>
</div>

<div id="view-plan"></div>
<div id="view-compare" style="display:none"></div>
<div id="view-mess" style="display:none"></div>
<div id="view-att" style="display:none"></div>
<div id="view-daily" style="display:none"></div>
<div id="view-master" style="display:none"></div>
</div>

<!-- ALERT MODAL FOR Q6 MISTAKE -->
<div id="alert-modal-container"></div>

<!-- EXPORT MODAL -->
<div id="export-modal-container"></div>

<script src="data.js"></script>
<script>
  async function initApp() {
    const fetchView = async (url) => {
      try {
        const res = await fetch(url);
        return await res.text();
      } catch (e) {
        console.error('Failed to load view:', url, e);
        return '';
      }
    };
    
    document.getElementById('view-plan').innerHTML = await fetchView('views/plan.html');
    document.getElementById('view-compare').innerHTML = await fetchView('views/compare.html');
    document.getElementById('view-mess').innerHTML = await fetchView('views/mess.html');
    document.getElementById('view-att').innerHTML = await fetchView('views/att.html');
    document.getElementById('view-daily').innerHTML = await fetchView('views/daily.html');
    document.getElementById('view-master').innerHTML = await fetchView('views/master.html');
    document.getElementById('alert-modal-container').innerHTML = await fetchView('components/alert-modal.html');
    document.getElementById('export-modal-container').innerHTML = await fetchView('components/export-modal.html');
    
    const script = document.createElement('script');
    script.src = 'app.js';
    document.body.appendChild(script);
  }
  initApp();
</script>

</body>
</html>
