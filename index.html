<meta name="theme-color" id="meta-theme-color" content="#ffffff">
<script>
  // Appearance: "system" (follow the phone, live), "light" or "dark". Default is system.
  var THEME_ICONS = { system: '🖥️', light: '☀️', dark: '🌙' };
  function themeMode() {
    var t = localStorage.getItem('mbaplanner_theme');
    return t === 'light' || t === 'dark' ? t : 'system';
  }
  function applyTheme() {
    var mode = themeMode();
    var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    if (dark) document.documentElement.setAttribute('data-theme', 'dark');
    else document.documentElement.removeAttribute('data-theme');
    document.getElementById('meta-theme-color').setAttribute('content', dark ? '#000000' : '#ffffff');
    ['theme-toggle', 'pwa-theme-inline'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) { el.textContent = THEME_ICONS[mode]; el.title = 'Appearance: ' + mode + ' (tap to change)'; }
    });
  }
  function setThemeMode(mode) {
    localStorage.setItem('mbaplanner_theme', mode);
    applyTheme();
    if (typeof savePreferencesForRoll === 'function') savePreferencesForRoll();
    if (typeof updateDrawerSettingsUI === 'function') updateDrawerSettingsUI();
  }
  function toggleTheme() {
    var order = ['system', 'light', 'dark'];
    setThemeMode(order[(order.indexOf(themeMode()) + 1) % 3]);
  }
  applyTheme();
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
    if (themeMode() === 'system') applyTheme();
  });
  // Some browsers (and iPhone home-screen apps) skip the change event; re-check when the app comes back into view.
  document.addEventListener('visibilitychange', function() {
    if (!document.hidden && themeMode() === 'system') applyTheme();
  });
</script>

<script>
  // Sign in anonymously before app.js attaches its database listeners: the
  // database rules require a signed-in user, and a listener attached too early
  // is rejected instead of retried. A returning user is restored from storage
  // almost instantly, so this also works offline.
  function signInFirst() {
    return new Promise(resolve => {
      try {
        firebase.initializeApp(FIREBASE_CONFIG);
        const auth = firebase.auth();
        const stop = auth.onAuthStateChanged(user => { if (user) { stop(); resolve(); } });
        auth.signInAnonymously().catch(err => { console.warn('Anonymous sign-in failed', err); resolve(); });
      } catch (e) { console.warn('Firebase auth unavailable', e); resolve(); }
      setTimeout(resolve, 4000);
    });
  }

  async function initApp() {
    await signInFirst();
    const fetchView = async (url) => {
      try {
        const res = await fetch(url);
        return await res.text();
      } catch (e) {
        console.error('Failed to load view:', url, e);
        return '';
      }
    };
    
    document.getElementById('view-plan').innerHTML = await fetchView('views/plan.html');
    document.getElementById('view-compare').innerHTML = await fetchView('views/compare.html');
    document.getElementById('view-menu').innerHTML = await fetchView('views/menu.html');
    document.getElementById('view-att').innerHTML = await fetchView('views/att.html');
    document.getElementById('view-daily').innerHTML = await fetchView('views/daily.html');
    document.getElementById('view-master').innerHTML = await fetchView('views/master.html');
    document.getElementById('alert-modal-container').innerHTML = await fetchView('components/alert-modal.html');
    document.getElementById('export-modal-container').innerHTML = await fetchView('components/export-modal.html');
    
    const script = document.createElement('script');
    script.src = 'app.js?v=46';
    document.body.appendChild(script);
  }
  initApp();
</script>
