<div class="view-section">
  <div class="section-header">
    <h2 class="section-title">⚙️ Control Center</h2>
    <p class="section-subtitle">Edit Live Daily Schedule (Admin Only)</p>
  </div>
  
  <div id="admin-editor-container" style="display:none;">
    <div class="card">
      
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
        <h3 style="font-size:16px; font-weight:700; color:var(--tx-info); margin:0;" id="admin-editing-title">📅 Live Schedule</h3>
        <input type="date" id="admin-add-date" onchange="adminAddCustomDate(this.value)" style="padding:6px 10px; border-radius:8px; border:1px solid var(--bd); background:var(--bg2); color:var(--tx); font-size:13px; outline:none;" title="Add another date">
      </div>

      
      <div id="admin-slots-container">
        <!-- Rendered via JS -->
      </div>
      
      <div style="margin-top:20px; display:flex; gap:10px;">
        <button class="ios-btn-primary" onclick="adminSaveSchedule()" style="flex:1;">💾 Save to Live Database</button>
      </div>
    </div>

    <div class="card" style="margin-top:16px;">
      <h3 style="font-size:16px; font-weight:700; color:var(--tx-info); margin:0 0 4px;">✏️ Class Updates by Students</h3>
      <p style="font-size:12px; color:var(--tx2); margin:0 0 10px;">Cancellations, moves and timing changes posted from the agenda. Remove anything wrong.</p>
      <div id="admin-class-updates"></div>
    </div>
  </div>
</div>
