<div class="view-section">
  <div class="section-header">
    <h2 class="section-title">⚙️ Control Center</h2>
    <p class="section-subtitle">Edit Live Daily Schedule (Admin Only)</p>
  </div>
  
  <div class="card" style="margin-bottom: 20px;">
    <label style="display:block; font-size:13px; font-weight:700; margin-bottom:8px; color:var(--tx);">Select Date to Edit</label>
    <div style="display:flex; gap:10px;">
      <input type="date" id="admin-date-picker" style="flex:1; padding:10px; border-radius:10px; border:1px solid var(--bd); background:var(--bg2); color:var(--tx); font-size:15px; font-family:inherit;">
      <button class="ios-btn-primary" onclick="adminLoadSchedule()" style="padding:0 20px;">Load</button>
    </div>
  </div>

  <div id="admin-editor-container" style="display:none;">
    <div class="card">
      <h3 style="font-size:16px; font-weight:700; margin-bottom:16px; color:var(--tx-info);" id="admin-editing-title">Editing Date</h3>
      
      <div id="admin-slots-container">
        <!-- Rendered via JS -->
      </div>
      
      <div style="margin-top:20px; display:flex; gap:10px;">
        <button class="ios-btn-primary" onclick="adminSaveSchedule()" style="flex:1;">💾 Save to Live Database</button>
      </div>
    </div>
  </div>
</div>
